<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>俊杰侃信奥 · 练习题库</title>
<link rel="stylesheet" href="nav.css?v=20261127a">
<link rel="stylesheet" href="auth.css?v=20261126i">
<link rel="stylesheet" href="paper.css?v=20261126x">
<style>
  .qsec{margin-bottom:18px;background:var(--ik-paper);border:1px solid var(--ik-rule);
    border-radius:2px;padding:16px 20px}
  .qsec .hd b{font-size:15px;letter-spacing:.04em}
  .qsec .bar{margin:10px 0 2px}
  .chlist{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
  .ch{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--ik-rule2);
    text-decoration:none;color:var(--ik-ink);font-size:13px}
  .ch i{width:24px;flex:0 0 24px;font-family:var(--ik-serif);font-style:normal;
    font-size:11.5px;color:var(--ik-ink3);font-variant-numeric:tabular-nums}
  .ch .nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch .ld{flex:1;min-width:20px;border-bottom:1px dotted #C9CCC6;transform:translateY(-4px)}
  .ch .ct{flex:0 0 auto;font-size:12px;color:var(--ik-ink3);font-variant-numeric:tabular-nums}
  .ch .ct.ok{color:#2A6A45}
  .ch:hover .nm{color:var(--ik-navy)}
  @media (max-width:820px){
    .chlist{grid-template-columns:1fr;column-gap:0}
    .page h1{font-size:24px}
  }
</style>
</head>
<body>

<div class="nav" data-page="lib"><div class="nav-in" id="navIn"></div></div>

<div class="page">
  <h1>练习题库</h1>
  <p class="sub" id="sub">按大类排列章节，点章名直接进入题单</p>
  <div id="grid"></div>
</div>

<div class="foot"><a href="https://beian.miit.gov.cn" target="_blank" rel="noopener">京ICP备________号</a></div>

<script src="data/catalog.js?v=20261127c"></script>
<script src="auth.js?v=20261127b"></script>
<script src="nav.js?v=20261127a"></script>
<script>
(function () {
  var C = window.CATALOG || { chapters: [] };
  var GROUPS = C.chapters || [];
  var done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem('studypage.done') || '[]')); } catch (e) {}

  var ALLN = 0, LESN = 0;
  GROUPS.forEach(function (g) {
    (g.lessons || []).forEach(function (l) {
      ALLN += (l.problems || []).length;
      if ((l.problems || []).length) LESN++;
    });
  });
  document.getElementById('sub').textContent =
    GROUPS.length + ' 大类 · ' + LESN + ' 章 · ' + ALLN + ' 题，点章名直接进题单';

  var nm = new URLSearchParams(location.search).get('name');
  var suffix = nm ? '&name=' + encodeURIComponent(nm) : '';

  function pad(n) { n = String(n); return n.length < 2 ? '0' + n : n; }

  document.getElementById('grid').innerHTML = GROUPS.map(function (g, gi) {
    var n = (g.lessons || []).reduce(function (a, l) { return a + (l.problems || []).length; }, 0);
    var ok = (g.lessons || []).reduce(function (a, l) {
      return a + (l.problems || []).filter(function (p) { return done.has('ybt' + p.pid); }).length;
    }, 0);
    var pct = n ? Math.round(ok / n * 100) : 0;

    var rows = (g.lessons || []).filter(function (l) { return (l.problems || []).length; }).map(function (l) {
      var ln = (l.problems || []).length;
      var lok = (l.problems || []).filter(function (p) { return done.has('ybt' + p.pid); }).length;
      var full = lok === ln && ln;
      return '<a class="ch" href="学习台.html?g=' + g.id + '&l=' + l.no + suffix + '">' +
        '<span class="nm">' + l.name + '</span>' +
        '<span class="ld"></span>' +
        '<span class="ct' + (full ? ' ok' : '') + '">' + (lok ? lok + '/' : '') + ln + ' 题</span>' +
        '</a>';
    }).join('');

    return '<section class="qsec">' +
      '<div class="hd"><b>' + pad(gi + 1) + ' · ' + g.name + '</b>' +
        '<span>' + (g.lessons || []).length + ' 节 · ' + n + ' 题</span>' +
        '<em>' + pct + '%</em></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="chlist">' + rows + '</div>' +
      '</section>';
  }).join('');
})();
</script>
<script>AuthGate.boot({ force: false });</script>
</body>
</html>
