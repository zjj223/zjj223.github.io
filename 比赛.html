<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>俊杰侃信奥 · 比赛</title>
<link rel="stylesheet" href="nav.css?v=20261127a">
<link rel="stylesheet" href="auth.css?v=20261128b">
<link rel="stylesheet" href="paper.css?v=20261126x">
<style>
  .tabbar{display:flex;gap:8px;margin:0 0 18px}
  .tb{border:1px solid var(--ik-rule);background:var(--ik-paper);color:var(--ik-ink2);
    font:inherit;font-size:12.5px;padding:6px 15px;border-radius:2px;cursor:pointer;letter-spacing:.02em}
  .tb:hover{border-color:var(--ik-navy);color:var(--ik-navy)}
  .tb.on{background:var(--ik-navy);border-color:var(--ik-navy);color:#fff;font-weight:600}
  .empty{padding:22px 0 24px}
  .gap{height:18px}
  .soon .ct{color:#8A6A16}
</style>
</head>
<body>

<div class="nav" data-page="contest"><div class="nav-in" id="navIn"></div></div>

<div class="page">
  <h1>比赛</h1>
  <p class="sub">本站目前只有俊杰月赛一种赛制，其余比赛形式后续再定</p>

  <div class="tabbar">
    <button class="tb on">进行中</button>
    <button class="tb">即将开始</button>
    <button class="tb">已结束</button>
  </div>

  <section class="card">
    <div class="hd"><b>进行中</b><span>0 场</span></div>
    <div class="empty">暂无进行中的比赛。第一场俊杰月赛开放后会出现在这里。</div>
  </section>

  <div class="gap"></div>

  <section class="card soon">
    <div class="hd"><b>即将开始</b><span>1 场</span></div>
    <a class="rowlink" href="俊杰月赛.html">
      <span class="nm">俊杰月赛 · 第 1 场</span>
      <span class="ct">未开放</span>
    </a>
  </section>
</div>

<div class="foot"><a href="https://beian.miit.gov.cn" target="_blank" rel="noopener">京ICP备________号</a></div>

<script src="auth.js?v=20261128b"></script>
<script src="nav.js?v=20261127a"></script>
<script>
(function () {
  document.querySelectorAll('.tb').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tb').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    });
  });
})();
</script>
<script>AuthGate.boot({ force: true });</script>
</body>
</html>
