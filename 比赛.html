<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>俊杰侃信奥 · 比赛</title>
<link rel="stylesheet" href="nav.css?v=20261126a">
<style>
  .empty{padding:40px 0;text-align:center;color:#b0b8c8;font-size:13px}
  .tabbar{display:flex;gap:8px;margin-bottom:14px}
  .tb{border:1px solid #e3e8f2;background:#fff;color:#5a6480;font:inherit;font-size:12.5px;
    padding:6px 14px;border-radius:7px;cursor:pointer}
  .tb.on{background:#2947c9;border-color:#2947c9;color:#fff}
</style>
</head>
<body>

<div class="nav" data-page="contest"><div class="nav-in" id="navIn"></div></div>

<div class="page">
  <h1>比赛</h1>
  <p class="sub">本站目前只有俊杰月赛一种赛制，其余比赛形式后续再定</p>

  <div class="tabbar">
    <button class="tb on">进行中</button>
    <button class="tb">即将开始</button>
    <button class="tb">已结束</button>
  </div>

  <div class="card">
    <h2>进行中的比赛</h2>
    <div class="empty">暂无进行中的比赛</div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>即将开始</h2>
    <a class="rowlink" href="俊杰月赛.html">
      <span class="nm">俊杰月赛 · 第 1 场</span>
      <span class="pill warn">未开放</span>
      <span class="ar">›</span>
    </a>
  </div>
</div>

<div class="foot"><a href="https://beian.miit.gov.cn" target="_blank" rel="noopener">京ICP备________号</a></div>

<script src="nav.js?v=20261126a"></script>
<script>
(function () {
  document.querySelectorAll('.tb').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tb').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    });
  });
})();
</script>
</body>
</html>
