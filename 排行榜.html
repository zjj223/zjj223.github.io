<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>俊杰侃信奥 · 排行榜</title>
<link rel="stylesheet" href="nav.css?v=20261127a">
<link rel="stylesheet" href="auth.css?v=20261128a">
<link rel="stylesheet" href="paper.css?v=20261126x">
<style>
  .mine{display:flex;align-items:center;gap:16px}
  .mine .av{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--ik-seal);color:var(--ik-seal);
    background:#FDF8F6;border-radius:2px;font-family:var(--ik-serif);font-size:19px;
    display:flex;align-items:center;justify-content:center}
  .mine .who{flex:1;min-width:0}
  .mine .who .nm{font-family:var(--ik-serif);font-size:19px;font-weight:700;letter-spacing:.06em}
  .mine .who .info{font-size:12px;color:var(--ik-ink3);margin-top:2px}
  .mine .sc{text-align:right}
  .mine .sc b{display:block;font-family:var(--ik-serif);font-size:28px;line-height:1.1;
    color:var(--ik-navy);font-variant-numeric:tabular-nums}
  .mine .sc span{font-size:11px;color:var(--ik-ink3)}
  .empty{padding:22px 0 24px}
  .gap{height:18px}
</style>
</head>
<body>

<div class="nav" data-page="rank"><div class="nav-in" id="navIn"></div></div>

<div class="page">
  <h1>排行榜</h1>
  <p class="sub">按通过题数排名，同分看提交次数</p>

  <section class="card mine">
    <div class="av" id="av">同</div>
    <div class="who">
      <div class="nm" id="meName">同学</div>
      <div class="info" id="meInfo">已通过 0 题 · 覆盖 0%</div>
    </div>
    <div class="sc">
      <b id="meOk">0</b>
      <span>通过题数</span>
    </div>
  </section>

  <div class="gap"></div>

  <section class="card">
    <div class="hd"><b>总榜</b><span>筹备中</span></div>
    <div class="empty">排行榜数据积累中，等参与的同学多了再公布。</div>
  </section>
</div>

<div class="foot"><a href="https://beian.miit.gov.cn" target="_blank" rel="noopener">京ICP备________号</a></div>

<script src="data/catalog.js?v=20261127c"></script>
<script src="auth.js?v=20261128a"></script>
<script src="nav.js?v=20261127a"></script>
<script>
(function () {
  var C = window.CATALOG || { chapters: [] };
  var ALL = [];
  (C.chapters || []).forEach(function (g) {
    (g.lessons || []).forEach(function (l) {
      (l.problems || []).forEach(function (p) { ALL.push(p); });
    });
  });
  var done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem('studypage.done') || '[]')); } catch (e) {}
  var ok = ALL.filter(function (p) { return done.has('ybt' + p.pid); }).length;

  var q = new URLSearchParams(location.search).get('name');
  var nm = q || (window.lkCoin ? window.lkCoin.name() : '') || '同学';

  document.getElementById('meName').textContent = nm;
  document.getElementById('av').textContent = nm.slice(0, 1);
  document.getElementById('meOk').textContent = ok;
  document.getElementById('meInfo').textContent =
    '已通过 ' + ok + ' 题 · 覆盖 ' + (ALL.length ? Math.round(ok / ALL.length * 100) : 0) + '%';
})();
</script>
<script>AuthGate.boot({ force: false });</script>
</body>
</html>
