<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>俊杰侃信奥 · 排行榜</title>
<link rel="stylesheet" href="nav.css?v=20261126a">
<style>
  .empty{padding:40px 0;text-align:center;color:#b0b8c8;font-size:13px}
  .mine{display:flex;align-items:center;gap:14px}
  .mine .av{width:40px;height:40px;border-radius:50%;background:#eef2ff;color:#2947c9;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:0 0 40px}
</style>
</head>
<body>

<div class="nav" data-page="rank"><div class="nav-in" id="navIn"></div></div>

<div class="page">
  <h1>排行榜</h1>
  <p class="sub">按通过题数排名，同分看提交次数</p>

  <div class="card mine">
    <div class="av" id="av">同</div>
    <div>
      <div style="font-weight:600" id="meName">同学</div>
      <div style="color:#98a2b8;font-size:12px" id="meInfo">已通过 0 题 · 覆盖 0%</div>
    </div>
    <div style="margin-left:auto;text-align:right">
      <div style="font-size:20px;font-weight:700;color:#2947c9" id="meOk">0</div>
      <div style="font-size:12px;color:#98a2b8">通过题数</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>总榜 <span class="pill">筹备中</span></h2>
    <div class="empty">排行榜数据积累中，等参与的同学多了再公布</div>
  </div>
</div>

<div class="foot"><a href="https://beian.miit.gov.cn" target="_blank" rel="noopener">京ICP备________号</a></div>

<script src="data/catalog.js?v=20261124b"></script>
<script src="nav.js?v=20261126c"></script>
<script>
(function () {
  var C = window.CATALOG || { chapters: [] };
  var ALL = [];
  (C.chapters || []).forEach(function (g) { (g.lessons || []).forEach(function (l) { (l.problems || []).forEach(function (p) { ALL.push(p); }); }); });
  var done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem('studypage.done') || '[]')); } catch (e) {}
  var ok = ALL.filter(function (p) { return done.has('ybt' + p.pid); }).length;
  var nm = new URLSearchParams(location.search).get('name') || '同学';
  document.getElementById('meName').textContent = nm;
  document.getElementById('av').textContent = nm.slice(0, 1);
  document.getElementById('meOk').textContent = ok;
  document.getElementById('meInfo').textContent = '已通过 ' + ok + ' 题 · 覆盖 ' + (ALL.length ? Math.round(ok / ALL.length * 100) : 0) + '%';
})();
</script>
</body>
</html>
