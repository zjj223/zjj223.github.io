<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>C++ 题单 · 俊杰侃信奥</title>
<style>
  :root{--blue:#2947c9;--blue-d:#1f36a0;--line:#e3e8f2;--ink:#262626;--dim:#98a2b8;--bg:#f4f6fa;--ok:#52c41a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .top-in{max-width:1100px;margin:0 auto;padding:0 18px;height:52px;display:flex;align-items:center;gap:12px}
  .logo{font-weight:700;font-size:15.5px;letter-spacing:.5px}
  .logo i{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--blue);color:#fff;
    font-size:12px;text-align:center;line-height:22px;font-style:normal;margin-right:8px;vertical-align:-4px}
  .back{font-size:12.5px;color:var(--dim);text-decoration:none;padding:4px 10px;border-radius:6px}
  .back:hover{background:#f2f4f9;color:var(--blue)}
  .sp{flex:1}
  .who{font-size:12.5px;color:var(--dim)}
  .coin{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:#fff8e6;
    border:1px solid #ffe2a8;color:#a26a00;padding:3px 10px;border-radius:999px;cursor:pointer;font-family:inherit}
  .coin:hover{background:#ffefcc}

  .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
  .hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .hd h1{margin:0;font-size:19px;font-weight:700}
  .hd .chap{font-size:12.5px;color:var(--dim)}
  .hd .prog{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:260px}
  .hd .track{width:180px;height:7px;background:#e9edf5;border-radius:99px;overflow:hidden}
  .hd .track i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
  .hd .pct{font-size:12.5px;color:var(--blue);font-weight:600}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tab{border:1px solid var(--line);background:#fff;color:#666;cursor:pointer;padding:6px 14px;
    border-radius:7px;font-size:12.5px}
  .tab:hover{border-color:#c3cfec;color:var(--blue)}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .tab.right{margin-left:auto}

  .table{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-weight:600;font-size:12.5px;color:#7b8499;background:#f8fafd;
    padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:#f4f8ff}
  tbody td{padding:11px 14px;border-bottom:1px solid #f1f4f9;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  .st{width:46px;text-align:center}
  .st .dot{display:inline-block;width:15px;height:15px;border-radius:50%;border:1.5px dashed #d6dcea}
  .st .done{width:17px;height:17px;border-radius:50%;background:var(--ok);color:#fff;
    font-size:11px;line-height:17px;display:inline-block;text-align:center}
  .id{width:86px;color:#98a2b8;font-variant-numeric:tabular-nums;font-size:12.5px}
  .ttl{color:var(--blue);font-weight:500;font-size:13.5px}
  tbody tr:hover .ttl{text-decoration:underline}
  .rate{width:230px}
  .rate-box{height:5px;background:#eef1f7;border-radius:99px;overflow:hidden;width:120px;display:inline-block;vertical-align:-1px}
  .rate-box i{display:block;height:100%;background:#8fb4ff;border-radius:99px}
  .rate-txt{display:inline-block;margin-left:9px;font-size:11.5px;color:#9aa3b5}
  .go{color:#b9c2d6;text-align:right;width:36px}
  tbody tr:hover .go{color:var(--blue)}
  .empty{padding:40px 0;text-align:center;color:#b0b8c8;font-size:13px}
  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,10px);background:rgba(37,43,55,.95);
    color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.22);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:99}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  @media (max-width:760px){ .hd .prog{margin-left:0;width:100%} .rate{display:none} }
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <span class="logo"><i>J</i>俊杰侃信奥</span>
    <a class="back" id="btnBack" href="学习台.html">← 学习台</a>
    <span class="sp"></span>
    <span class="who" id="whoName"></span>
    <button class="coin" id="btnCoin">🪙 128</button>
  </div>
</div>

<div class="wrap">
  <div class="hd">
    <h1>C++ 题单</h1>
    <span class="chap" id="chapText">第一章 顺序结构 · 0 题</span>
    <div class="prog">
      <span class="track"><i id="progBar" style="width:0%"></i></span>
      <span class="pct" id="progPct">0%</span>
    </div>
  </div>

  <div class="tabs" id="statusTabs">
    <button class="tab on" data-s="all">全部</button>
    <button class="tab" data-s="todo">未做</button>
    <button class="tab" data-s="done">已通过</button>
    <button class="tab right" data-k="ex">例题</button>
    <button class="tab" data-k="pr">练习</button>
  </div>

  <div class="table">
    <table>
      <thead><tr><th class="st">状态</th><th class="id">题号</th><th>题目</th><th class="rate">通过率</th><th class="go"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script src="data/ybt.js"></script>
<script>
const Y = window.YBT || { problems: [] };
const PROBS = (Y.problems || []).slice();
const DONE_KEY = 'studypage.done';
const doneSet = () => { try { return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]')); } catch (e) { return new Set(); } };
const pidOf = (p) => 'ybt' + p.pid;
const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const nameOf = (t) => t.replace(/^【例[0-9.]+】/, '').replace(/^练[0-9.]+/, '').trim();
const kindOf = (t) => (/^【例/.test(t) ? 'ex' : 'pr');

const CDN_ONLY = /(^|\.)doubaocdn\.com$/.test(location.hostname) || /(^|\.)byteimg\.com$/.test(location.hostname);
const NAV = { home: CDN_ONLY ? '' : '学习台.html', work: CDN_ONLY ? '' : '预览_DevC布局.html' };

const state = { status: 'all', kind: 'all' };

let toastTimer = null;
function toast(msg) {
  let el = document.getElementById('toastBox');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toastBox'; el.className = 'toast';
    el.addEventListener('click', () => el.classList.remove('on'));
    document.body.appendChild(el);
  }
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}
const go = (url, note) => { if (!url) return toast(note || '线上副本没有这一页'); location.href = url; };

const qname = new URLSearchParams(location.search).get('name');
if (qname) document.getElementById('whoName').textContent = qname;

function render() {
  const done = doneSet();
  const list = PROBS.filter((p) => {
    if (state.status === 'done' && !done.has(pidOf(p))) return false;
    if (state.status === 'todo' && done.has(pidOf(p))) return false;
    if (state.kind !== 'all' && kindOf(p.title) !== state.kind) return false;
    return true;
  });
  document.getElementById('rows').innerHTML = list.length ? list.map((p) => {
    const ok = done.has(pidOf(p));
    const rate = p.sub ? Math.round(p.ac / p.sub * 100) : 0;
    return '<tr data-id="' + pidOf(p) + '" tabindex="0">' +
      '<td class="st">' + (ok ? '<span class="done">✓</span>' : '<span class="dot"></span>') + '</td>' +
      '<td class="id">' + p.pid + '</td>' +
      '<td><span class="ttl">' + esc(nameOf(p.title)) + '</span></td>' +
      '<td class="rate"><span class="rate-box"><i style="width:' + Math.min(100, rate) + '%"></i></span>' +
        '<span class="rate-txt">' + rate + '%</span></td>' +
      '<td class="go">›</td></tr>';
  }).join('') : '<tr><td colspan="5"><div class="empty">没有符合条件的题目</div></td></tr>';
}

function renderHead() {
  const done = doneSet();
  const ok = PROBS.filter((p) => done.has(pidOf(p))).length;
  document.getElementById('chapText').textContent = '第一章 顺序结构 · ' + PROBS.length + ' 题';
  document.getElementById('progBar').style.width = (PROBS.length ? ok / PROBS.length * 100 : 0) + '%';
  document.getElementById('progPct').textContent = (PROBS.length ? Math.round(ok / PROBS.length * 100) : 0) + '%  · ' + ok + '/' + PROBS.length;
}

document.getElementById('statusTabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  if (b.dataset.s) {
    state.status = b.dataset.s;
    document.querySelectorAll('#statusTabs .tab[data-s]').forEach((x) => x.classList.toggle('on', x === b));
  } else {
    const k = b.dataset.k;
    state.kind = (state.kind === k) ? 'all' : k;
    document.querySelectorAll('#statusTabs .tab[data-k]').forEach((x) => x.classList.toggle('on', state.kind !== 'all' && x.dataset.k === state.kind));
  }
  render();
});

document.getElementById('rows').addEventListener('click', (e) => {
  const tr = e.target.closest('tr[data-id]'); if (!tr) return;
  go(NAV.work + '?pid=' + tr.dataset.id, '线上单文件副本没有做题页');
});
document.getElementById('rows').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const tr = e.target.closest('tr[data-id]');
  if (tr) go(NAV.work + '?pid=' + tr.dataset.id, '线上单文件副本没有做题页');
});
document.getElementById('btnBack').onclick = (e) => { if (!NAV.home) { e.preventDefault(); go(null, '学习台只在本机'); } };
document.getElementById('btnCoin').onclick = () => toast('金币系统还没接通');

render();
renderHead();
</script>
</body>
</html>
